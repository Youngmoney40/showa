name: Android APK Build

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Xmx4g -XX:MaxMetaspaceSize=1g

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # This caches ~/.npm

      # 3️⃣ Cache node_modules
      - name: Cache Node Modules
        id: cache-node-modules
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            **/node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      # 4️⃣ Install dependencies (only if cache miss)
      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      # 5️⃣ Set up keystore
      - name: Set up keystore
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/showa-release-key.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # 6️⃣ Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      # 7️⃣ Cache Gradle dependencies + wrapper
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*  # Exclude build cache if you want fresh builds
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # 8️⃣ Cache React Native build artifacts (optional but helpful)
      - name: Cache React Native Build
        uses: actions/cache@v3
        with:
          path: |
            ${{ github.workspace }}/android/app/build
            !${{ github.workspace }}/android/app/build/outputs  # Don't cache APK outputs
          key: react-native-build-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/package-lock.json', 'index.js', '**/*.js', '**/*.json') }}
          restore-keys: |
            react-native-build-${{ runner.os }}-

      # 9️⃣ Make gradlew executable
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # 🔟 Generate React Native JS bundle
      - name: Bundle React Native JS
        run: |
          mkdir -p android/app/src/main/assets
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      # 1️⃣1️⃣ Build Release APK
      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon  # Removed clean for faster builds

      # 1️⃣2️⃣ Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
