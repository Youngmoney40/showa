# =========================
# Gradle performance tuning
# =========================
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Better worker count based on CPU cores
org.gradle.workers.max=4

# =========================
# Android settings
# =========================
android.useAndroidX=true
android.enableJetifier=true

# =========================
# React Native
# =========================
# Only build for ARM architectures (most common on real devices)
reactNativeArchitectures=armeabi-v7a,arm64-v8a

# only use this for testing
# reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

#  Disable new architecture for better compatibility
newArchEnabled=false

#  Hermes is OK
hermesEnabled=true

# Disable edge-to-edge (handle in manifest conditionally)
edgeToEdgeEnabled=false

# =========================
# Performance
# =========================
#  Enable incremental builds
android.enableR8.fullMode=false


MYAPP_RELEASE_STORE_FILE=showa-release-key.keystore
MYAPP_RELEASE_KEY_ALIAS=e-showa
MYAPP_RELEASE_STORE_PASSWORD=showa!@#$50
MYAPP_RELEASE_KEY_PASSWORD=showa!@#$50
